name: Alxcer Guard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"
  push:
    branches: [main]
    paths:
      - "bot/src/**"
      - "bot/package*.json"
      - "bot/config.json"
      - ".github/workflows/alxcer-guard.yml"

concurrency:
  group: alxcer-guard
  cancel-in-progress: true

permissions:
  contents: write
  models: read
  actions: write

jobs:
  run-bot:
    name: Run Discord bot
    runs-on: ubuntu-latest
    timeout-minutes: 356
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install system dependencies (ffmpeg only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Cache YOLO model
        uses: actions/cache@v4
        with:
          path: bot/.cache/models
          key: yolov5n-onnx-v6.0-fp32

      - name: Cache Sarabun Thai font
        uses: actions/cache@v4
        with:
          path: bot/.cache/fonts
          key: sarabun-bold-v1

      - name: Install bot dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: |
          npm test
          npm run check:boot

      - name: Run Alxcer Guard
        env:
          DISCORD_PERSONAL_ACCESS_TOKEN: ${{ secrets.DISCORD_PERSONAL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DEEPGRAM_MODEL: nova-3
          DEEPGRAM_LANGUAGE: th
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          set +e
          timeout --signal=TERM --kill-after=30s 345m node src/index.js 2>&1 | tee /tmp/bot_run.log
          BOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BOT_STATUS" = "124" ] || [ "$BOT_STATUS" = "143" ]; then
            echo "Guard reached the planned rotation window"
            exit 0
          fi
          exit "$BOT_STATUS"

      - name: Self-restart (keep 24/7 online)
        if: success()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
        run: |
          echo "Triggering self-restart to keep bot 24/7 online..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/alxcer-guard.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "Dispatch status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "204" ]; then
            echo "Self-restart triggered successfully"
          else
            echo "Self-restart failed with status $HTTP_STATUS"
            exit 1
          fi
