name: Sync Deepgram to Onepune

on:
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy encrypted Deepgram secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: |
          test -n "$DEEPGRAM_API_KEY"
          printf '%s' "$DEEPGRAM_API_KEY" | gh secret set DEEPGRAM_API_KEY --repo Perth321/Onepune
